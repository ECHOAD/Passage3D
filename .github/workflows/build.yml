name: Build

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: make build
        run: make build
      - name: passage version
        run: ./build/passage version --long

  docker:
    name: Docker image (static musl binary)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: docker build
        run: docker build -t passage:ci .
      - name: smoke test
        run: docker run --rm passage:ci passage version --long
