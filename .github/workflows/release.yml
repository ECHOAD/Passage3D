name: Release

# Builds and publishes release binaries when a version tag is pushed.
# Static linux amd64/arm64 binaries with libwasmvm linked in (muslc),
# built via the goreleaser-cross image which bundles the CGO cross toolchains.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'      # e.g. v4.0.4
      - 'v[0-9]+.[0-9]+.[0-9]+-*'    # e.g. v4.0.4-rc1

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # goreleaser-cross ships Go 1.22.7 with GOTOOLCHAIN=local, while go.mod
      # requires go 1.22.11 (the toolchain mainnet binaries are built with):
      # without GOTOOLCHAIN the build aborts with
      # "go.mod requires go >= 1.22.11 (running go 1.22.7; GOTOOLCHAIN=local)".
      - name: Run GoReleaser (cross)
        run: |
          docker run --rm \
            --entrypoint /bin/bash \
            -e GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
            -e GOTOOLCHAIN=go1.22.11 \
            -v "${{ github.workspace }}":/go/src/github.com/envadiv/Passage3D \
            -w /go/src/github.com/envadiv/Passage3D \
            ghcr.io/goreleaser/goreleaser-cross:v1.22.7 \
            -c "git config --global --add safe.directory '*' && goreleaser release --clean"
